[build]
  command = "npm run build"
  publish = "dist"

# --- Cross-origin isolation: exigido pelo Godot 4 Web com threads ---
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
    Cross-Origin-Resource-Policy = "same-origin"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"

# As builds do Godot mudam a cada playtest: não deixe o navegador cachear.
[[headers]]
  for = "/games/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA: tudo que não for arquivo real cai no index.html.
# A regra do /games/* vem antes para os jogos nunca serem reescritos.
[[redirects]]
  from = "/games/*"
  to = "/games/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
